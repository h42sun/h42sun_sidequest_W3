<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a3a" />
    <title>The ocean calls to you</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <h1 class="title"></h1>
        <p class="subtitle"></p>
      </div>
    </header>

    <main class="wrap">
      <section class="card">
        <div class="canvas-frame">
          <!-- p5 canvas mounts here -->
        </div>

      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <small></small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
    <!-- your existing files (order matters) -->
    <script src="start.js"></script>
    <script src="main.js"></script>
    <script src="game.js"></script>
    <script src="left.js"></script>
    <script src="right.js"></script>

    <script src="home.js"></script>
    <script src="seaglass.js"></script>
  </body>
</html>
